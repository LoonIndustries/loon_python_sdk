[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loon-python-sdk"
version = "0.0.3"
description = "Python SDK for the Loon Industries robotic arm"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Jake Horner", email = "jakehorner@loon.industries" },
    { name = "Ryan Erickson", email = "ryanerickson@loon.industries" },
]
requires-python = ">=3.8"
dependencies = [
    "websocket-client>=1.6.0",
    "pyserial>=3.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/LoonIndustries/loon_python_sdk"
Repository = "https://github.com/LoonIndustries/loon_python_sdk"

[tool.setuptools.packages.find]
where = ["src"]
